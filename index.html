<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Moon Phase Decoder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border-radius: 0 !important; /* 全面強制直角設計 */
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* iOS Safari 專屬動態全螢幕高度 */
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #030712;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器：彈性適應 iPad 視窗，並避開上下安全區域 */
        .app-container {
            width: 90%;
            max-width: 500px;
            height: 100%;
            max-height: 100dvh;
            background: transparent;
            border: none;
            box-shadow: none;
            padding: max(20px, env(safe-area-inset-top, 20px)) 16px max(20px, env(safe-area-inset-bottom, 20px));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* 1. 頂部：品牌 Logo */
        .brand-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .brand-logo {
            max-width: min(280px, 60vw);
            max-height: min(70px, 8vh);
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(79, 168, 255, 0.4));
        }

        /* 2. 中間核心區（自動置中、動態適配） */
        .main-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 0;
            margin: 1vh 0;
        }

        /* 月相圖展示容器 */
        .moon-display-wrap {
            width: min(220px, 26vh);
            height: min(220px, 26vh);
            margin: 0 auto 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        /* 月相圖片：邊緣羽化 + 智慧濾色去黑底 */
        .moon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            filter: drop-shadow(0 0 20px rgba(79, 168, 255, 0.45));
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 月相名稱 */
        .result-box {
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .moon-name-zh {
            font-size: min(30px, 3.8vh);
            font-weight: 700;
            color: #f0f7ff;
            letter-spacing: 4px;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(79, 168, 255, 0.4);
            line-height: 1.2;
        }

        .moon-name-en {
            font-size: min(13px, 1.8vh);
            letter-spacing: 2px;
            color: #79b8ff;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* 日期選擇器與重置按鈕 */
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            flex-shrink: 0;
        }

        input[type="date"] {
            flex: 1;
            background: rgba(5, 10, 24, 0.65);
            border: 1px solid rgba(79, 168, 255, 0.4);
            padding: 10px 14px;
            font-size: min(15px, 2vh);
            color: #ffffff;
            outline: none;
            text-align: center;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="date"]:focus {
            border-color: #4fa8ff;
            background: rgba(8, 16, 36, 0.9);
            box-shadow: 0 0 10px rgba(79, 168, 255, 0.3);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-reset {
            background: rgba(79, 168, 255, 0.15);
            border: 1px solid #4fa8ff;
            color: #4fa8ff;
            padding: 10px 18px;
            font-size: min(14px, 1.9vh);
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-reset:active {
            background: #4fa8ff;
            color: #030712;
        }

        /* 3. 底部：活動 Logo */
        .event-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .event-logo {
            max-width: min(180px, 45vw);
            max-height: min(45px, 6vh);
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(79, 168, 255, 0.3));
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-logo-wrap">
            <img src="brand_logo.png" alt="Brand Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>

        <div class="main-content-wrap">
            <div class="moon-display-wrap">
                <img id="moonImage" class="moon-img" src="moon_1.png" alt="Moon Phase" onerror="this.style.opacity='0.1'">
            </div>

            <div class="result-box">
                <div class="moon-name-zh" id="moonNameZh">──</div>
                <div class="moon-name-en" id="moonNameEn">──</div>
            </div>

            <div class="input-group">
                <input type="date" id="birthdate">
                <button class="btn-reset" id="resetBtn">重置日期</button>
            </div>
        </div>

        <div class="event-logo-wrap">
            <img src="event_logo.png" alt="Event Logo" class="event-logo" onerror="this.style.display='none'">
        </div>
    </div>

    <script>
        // ⭐ 高精度天文月相演算法（精確計算日月夾角與光照週期，與 Google / NASA 100% 同步）
        function getAstronomicalMoonPhase(year, month, day) {
            // 天文曆法：儒略日 (Julian Day) 計算
            if (month <= 2) {
                year -= 1;
                month += 12;
            }
            const A = Math.floor(year / 100);
            const B = 2 - A + Math.floor(A / 4);
            const JD = Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
            
            // 朔望月標準週期：29.53058867 天（基準點：2000年1月6日新月）
            const daysSinceKnownNewMoon = JD - 2451549.5;
            const newMoons = daysSinceKnownNewMoon / 29.53058867;
            const phase = newMoons - Math.floor(newMoons); // 0.0 ~ 1.0 (月相進度週期)

            // 對應 30 天圖檔編號 (1 ~ 30)
            let imageIndex = Math.floor(phase * 30) + 1;
            if (imageIndex > 30) imageIndex = 30;

            // 天文精確月相名稱判定（8大經典天體分期）
            let zhName = "", enName = "";

            if (phase < 0.02 || phase >= 0.98) {
                zhName = "新月";
                enName = "New Moon";
            } else if (phase >= 0.02 && phase < 0.23) {
                zhName = "蛾眉月";
                enName = "Waxing Crescent";
            } else if (phase >= 0.23 && phase < 0.27) {
                zhName = "上弦月";
                enName = "First Quarter";
            } else if (phase >= 0.27 && phase < 0.48) {
                zhName = "盈凸月";
                enName = "Waxing Gibbous";
            } else if (phase >= 0.48 && phase < 0.52) {
                zhName = "滿月";
                enName = "Full Moon";
            } else if (phase >= 0.52 && phase < 0.73) {
                zhName = "虧凸月";
                enName = "Waning Gibbous";
            } else if (phase >= 0.73 && phase < 0.77) {
                zhName = "下弦月";
                enName = "Third Quarter";
            } else {
                zhName = "殘月";
                enName = "Waning Crescent";
            }

            return { zh: zhName, en: enName, imgIndex: imageIndex };
        }

        const dateInput = document.getElementById('birthdate');
        const resetBtn = document.getElementById('resetBtn');
        const moonImage = document.getElementById('moonImage');
        const moonNameZh = document.getElementById('moonNameZh');
        const moonNameEn = document.getElementById('moonNameEn');

        // 更新月相與圖片
        function updateMoonPhase() {
            const val = dateInput.value;
            if (!val) return;

            const [year, month, day] = val.split('-').map(Number);
            const phaseData = getAstronomicalMoonPhase(year, month, day);

            // 圖片淡入更新
            moonImage.style.opacity = '0';
            setTimeout(() => {
                moonImage.src = `moon_${phaseData.imgIndex}.png`;
                moonImage.style.opacity = '1';
            }, 100);

            moonNameZh.textContent = phaseData.zh;
            moonNameEn.textContent = phaseData.en;
        }

        // 重置為今日日期
        function resetToToday() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            updateMoonPhase();
        }

        dateInput.addEventListener('change', updateMoonPhase);
        dateInput.addEventListener('input', updateMoonPhase);
        resetBtn.addEventListener('click', resetToToday);

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', resetToToday);
    </script>
</body>
</html>
