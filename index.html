<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Moon Phase Decoder</title>
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border-radius: 0 !important; /* 全面強制直角設計 */
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* iOS Safari 專屬動態全螢幕高度 */
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #030712;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器：彈性適應 iPad 視窗，並避開上下安全區域 */
        .app-container {
            width: 90%;
            max-width: 500px;
            height: 100%;
            max-height: 100dvh;
            background: transparent;
            border: none;
            box-shadow: none;
            /* 上下留白依據螢幕高度動態計算，並兼容 safe-area */
            padding: max(20px, env(safe-area-inset-top, 20px)) 16px max(20px, env(safe-area-inset-bottom, 20px));
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 頂部 Logo、中間月相、底部 Logo 完美均分 */
            align-items: center;
            text-align: center;
        }

        /* 1. 頂部：品牌 Logo（防擠壓、動態縮放） */
        .brand-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .brand-logo {
            max-width: min(280px, 60vw);
            max-height: min(70px, 8vh);
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(79, 168, 255, 0.4));
        }

        /* 2. 中間核心區（自動置中、動態適配） */
        .main-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 0; /* 防止子元素撐爆容器 */
            margin: 1vh 0;
        }

        /* 月相圖展示容器（根據 iPad 高度動態縮放） */
        .moon-display-wrap {
            width: min(220px, 26vh);
            height: min(220px, 26vh);
            margin: 0 auto 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        /* 月相圖片：邊緣羽化 + 智慧濾色去黑底 */
        .moon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            filter: drop-shadow(0 0 20px rgba(79, 168, 255, 0.45));
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 月相名稱 */
        .result-box {
            margin-bottom: 2vh;
            flex-shrink: 0;
        }

        .moon-name-zh {
            font-size: min(30px, 3.8vh);
            font-weight: 700;
            color: #f0f7ff;
            letter-spacing: 4px;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(79, 168, 255, 0.4);
            line-height: 1.2;
        }

        .moon-name-en {
            font-size: min(13px, 1.8vh);
            letter-spacing: 2px;
            color: #79b8ff;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* 日期選擇器與重置按鈕（直角俐落設計） */
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            flex-shrink: 0;
        }

        input[type="date"] {
            flex: 1;
            background: rgba(5, 10, 24, 0.65);
            border: 1px solid rgba(79, 168, 255, 0.4);
            padding: 10px 14px;
            font-size: min(15px, 2vh);
            color: #ffffff;
            outline: none;
            text-align: center;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="date"]:focus {
            border-color: #4fa8ff;
            background: rgba(8, 16, 36, 0.9);
            box-shadow: 0 0 10px rgba(79, 168, 255, 0.3);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        /* 重置按鈕 */
        .btn-reset {
            background: rgba(79, 168, 255, 0.15);
            border: 1px solid #4fa8ff;
            color: #4fa8ff;
            padding: 10px 18px;
            font-size: min(14px, 1.9vh);
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-reset:active {
            background: #4fa8ff;
            color: #030712;
        }

        /* 3. 底部：活動 Logo（防擠壓、底端貼合） */
        .event-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .event-logo {
            max-width: min(180px, 45vw);
            max-height: min(45px, 6vh);
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(79, 168, 255, 0.3));
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-logo-wrap">
            <img src="brand_logo.png" alt="Brand Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>

        <div class="main-content-wrap">
            <div class="moon-display-wrap">
                <img id="moonImage" class="moon-img" src="moon_1.png" alt="Moon Phase" onerror="this.style.opacity='0.1'">
            </div>

            <div class="result-box">
                <div class="moon-name-zh" id="moonNameZh">──</div>
                <div class="moon-name-en" id="moonNameEn">──</div>
            </div>

            <div class="input-group">
                <input type="date" id="birthdate">
                <button class="btn-reset" id="resetBtn">重置日期</button>
            </div>
        </div>

        <div class="event-logo-wrap">
            <img src="event_logo.png" alt="Event Logo" class="event-logo" onerror="this.style.display='none'">
        </div>
    </div>

    <script>
        // 農曆 1~30 天對應之月相名稱
        function getPhaseName(dayNum) {
            if (dayNum === 1 || dayNum === 2) {
                return { zh: "新月", en: "New Moon" };
            } else if (dayNum >= 3 && dayNum <= 7) {
                return { zh: "蛾眉月", en: "Waxing Crescent" };
            } else if (dayNum >= 8 || dayNum === 9) {
                return { zh: "上弦月", en: "First Quarter" };
            } else if (dayNum >= 10 && dayNum <= 14) {
                return { zh: "盈凸月", en: "Waxing Gibbous" };
            } else if (dayNum === 15 || dayNum === 16) {
                return { zh: "滿月", en: "Full Moon" };
            } else if (dayNum >= 17 && dayNum <= 21) {
                return { zh: "虧凸月", en: "Waning Gibbous" };
            } else if (dayNum === 22 || dayNum === 23) {
                return { zh: "下弦月", en: "Third Quarter" };
            } else {
                return { zh: "殘月", en: "Waning Crescent" };
            }
        }

        const dateInput = document.getElementById('birthdate');
        const resetBtn = document.getElementById('resetBtn');
        const moonImage = document.getElementById('moonImage');
        const moonNameZh = document.getElementById('moonNameZh');
        const moonNameEn = document.getElementById('moonNameEn');

        // 核心計算：西元轉農曆 ➔ 精準載入 moon_1.png 至 moon_30.png
        function updateMoonPhase() {
            const val = dateInput.value;
            if (!val) return;

            const [year, month, day] = val.split('-').map(Number);
            const solar = Solar.fromYmd(year, month, day);
            const lunar = solar.getLunar();
            const dayNum = lunar.getDay(); // 農曆日：1 至 30

            const phaseInfo = getPhaseName(dayNum);

            // 圖片淡入更新
            moonImage.style.opacity = '0';
            setTimeout(() => {
                moonImage.src = `moon_${dayNum}.png`;
                moonImage.style.opacity = '1';
            }, 100);

            moonNameZh.textContent = phaseInfo.zh;
            moonNameEn.textContent = phaseInfo.en;
        }

        // 重置為今日日期
        function resetToToday() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            updateMoonPhase();
        }

        dateInput.addEventListener('change', updateMoonPhase);
        dateInput.addEventListener('input', updateMoonPhase);
        resetBtn.addEventListener('click', resetToToday);

        // 頁面初始化
        window.addEventListener('DOMContentLoaded', resetToToday);
    </script>
</body>
</html>
