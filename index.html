<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Moon Phase Decoder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border-radius: 0 !important; /* 全面強制直角設計 */
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* 支援 iOS Safari 動態全螢幕高度 */
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #030712;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主容器：嚴格限制在 100dvh 內，防止任何溢出 */
        .app-container {
            width: 90%;
            max-width: 480px;
            height: 100dvh;
            max-height: 100dvh;
            background: transparent;
            border: none;
            box-shadow: none;
            /* 針對 iPad 上下安全區域留白 */
            padding: max(15px, env(safe-area-inset-top, 15px)) 16px max(15px, env(safe-area-inset-bottom, 15px));
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 上中下完美均分 */
            align-items: center;
            text-align: center;
        }

        /* 1. 頂部：品牌 Logo */
        .brand-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
            padding-top: 5px;
        }

        .brand-logo {
            max-width: min(260px, 55vw);
            max-height: min(60px, 7vh);
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(79, 168, 255, 0.4));
        }

        /* 2. 中間核心區（自適應置中） */
        .main-content-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            min-height: 0;
            margin: 5px 0;
        }

        /* 月相圖展示容器 */
        .moon-display-wrap {
            width: min(200px, 22vh);
            height: min(200px, 22vh);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        /* 月相圖片：邊緣羽化 + 智慧濾色去黑底 */
        .moon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            mask-image: radial-gradient(circle at center, black 58%, transparent 68%);
            filter: drop-shadow(0 0 20px rgba(79, 168, 255, 0.45));
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* 月相名稱 */
        .result-box {
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .moon-name-zh {
            font-size: min(28px, 3.4vh);
            font-weight: 700;
            color: #f0f7ff;
            letter-spacing: 4px;
            margin-bottom: 3px;
            text-shadow: 0 0 15px rgba(79, 168, 255, 0.4);
            line-height: 1.2;
        }

        .moon-name-en {
            font-size: min(13px, 1.6vh);
            letter-spacing: 2px;
            color: #79b8ff;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* 日期選擇器與重置按鈕 */
        .input-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
            max-width: 340px;
            flex-shrink: 0;
        }

        input[type="date"] {
            flex: 1;
            background: rgba(5, 10, 24, 0.65);
            border: 1px solid rgba(79, 168, 255, 0.4);
            padding: 8px 12px;
            font-size: min(15px, 1.8vh);
            color: #ffffff;
            outline: none;
            text-align: center;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="date"]:focus {
            border-color: #4fa8ff;
            background: rgba(8, 16, 36, 0.9);
            box-shadow: 0 0 10px rgba(79, 168, 255, 0.3);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-reset {
            background: rgba(79, 168, 255, 0.15);
            border: 1px solid #4fa8ff;
            color: #4fa8ff;
            padding: 8px 16px;
            font-size: min(14px, 1.7vh);
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-reset:active {
            background: #4fa8ff;
            color: #030712;
        }

        /* 3. 底部：活動 Logo */
        .event-logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
            padding-bottom: 5px;
        }

        .event-logo {
            max-width: min(160px, 40vw);
            max-height: min(40px, 5.5vh);
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(79, 168, 255, 0.3));
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-logo-wrap">
            <img src="brand_logo.png" alt="Brand Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>

        <div class="main-content-wrap">
            <div class="moon-display-wrap">
                <img id="moonImage" class="moon-img" src="moon_1.png" alt="Moon Phase" onerror="this.style.opacity='0.1'">
            </div>

            <div class="result-box">
                <div class="moon-name-zh" id="moonNameZh">──</div>
                <div class="moon-name-en" id="moonNameEn">──</div>
            </div>

            <div class="input-group">
                <input type="date" id="birthdate">
                <button class="btn-reset" id="resetBtn">重置日期</button>
            </div>
        </div>

        <div class="event-logo-wrap">
            <img src="event_logo.png" alt="Event Logo" class="event-logo" onerror="this.style.display='none'">
        </div>
    </div>

    <script>
        // 🌟 NASA / Jean Meeus 高精度天文月相角度演算法
        function getAccurateMoonPhase(year, month, day) {
            // 計算儒略日 (Julian Day Number)
            let y = year;
            let m = month;
            if (m <= 2) {
                y -= 1;
                m += 12;
            }
            const A = Math.floor(y / 100);
            const B = 2 - A + Math.floor(A / 4);
            const JD = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + B - 1524.5;
            
            // 自 J2000.0 起算之世紀數 T
            const T = (JD - 2451545.0) / 36525.0;

            // 太陽平黃經 L0 (度)
            let L0 = 280.46646 + 36000.76983 * T;
            // 太陽平近點角 M (度)
            let M = 357.52911 + 35999.05029 * T;
            // 太陽真黃經 Sun_L (度)
            let Sun_L = L0 + (1.914602 - 0.004817 * T) * Math.sin(M * Math.PI / 180) + 0.019993 * Math.sin(2 * M * Math.PI / 180);

            // 月球平黃經 L' (度)
            let LP = 218.3165 + 481267.8813 * T;
            // 月球平近點角 M' (度)
            let MP = 134.9634 + 477198.8676 * T;
            // 月球真黃經 Moon_L (度，取主要攝動項)
            let Moon_L = LP + 6.289 * Math.sin(MP * Math.PI / 180);

            // 日月黃經差 / 距角 D (0° ~ 360°)
            let elongation = (Moon_L - Sun_L) % 360;
            if (elongation < 0) elongation += 360;

            // 對應 30 天圖檔序號 (1 ~ 30)
            let imgIndex = Math.floor((elongation / 360.0) * 30) + 1;
            if (imgIndex > 30) imgIndex = 30;

            // 天文精準判定 8 大月相名稱（以距角 elongation 判定）
            let zhName = "", enName = "";

            if (elongation < 10 || elongation >= 350) {
                zhName = "新月";
                enName = "New Moon";
            } else if (elongation >= 10 && elongation < 82) {
                zhName = "蛾眉月";
                enName = "Waxing Crescent";
            } else if (elongation >= 82 && elongation < 98) {
                zhName = "上弦月";
                enName = "First Quarter";
            } else if (elongation >= 98 && elongation < 170) {
                zhName = "盈凸月";
                enName = "Waxing Gibbous";
            } else if (elongation >= 170 && elongation < 190) {
                zhName = "滿月";
                enName = "Full Moon";
            } else if (elongation >= 190 && elongation < 262) {
                zhName = "虧凸月";
                enName = "Waning Gibbous";
            } else if (elongation >= 262 && elongation < 278) {
                zhName = "下弦月";
                enName = "Third Quarter";
            } else {
                zhName = "殘月";
                enName = "Waning Crescent";
            }

            return { zh: zhName, en: enName, imgIndex: imgIndex };
        }

        const dateInput = document.getElementById('birthdate');
        const resetBtn = document.getElementById('resetBtn');
        const moonImage = document.getElementById('moonImage');
        const moonNameZh = document.getElementById('moonNameZh');
        const moonNameEn = document.getElementById('moonNameEn');

        function updateMoonPhase() {
            const val = dateInput.value;
            if (!val) return;

            const [year, month, day] = val.split('-').map(Number);
            const phaseData = getAccurateMoonPhase(year, month, day);

            moonImage.style.opacity = '0';
            setTimeout(() => {
                moonImage.src = `moon_${phaseData.imgIndex}.png`;
                moonImage.style.opacity = '1';
            }, 100);

            moonNameZh.textContent = phaseData.zh;
            moonNameEn.textContent = phaseData.en;
        }

        function resetToToday() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            dateInput.value = `${y}-${m}-${d}`;
            updateMoonPhase();
        }

        dateInput.addEventListener('change', updateMoonPhase);
        dateInput.addEventListener('input', updateMoonPhase);
        resetBtn.addEventListener('click', resetToToday);

        window.addEventListener('DOMContentLoaded', resetToToday);
    </script>
</body>
</html>
